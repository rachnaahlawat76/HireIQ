<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireIQ - AI Interview Platform</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>HireIQ</h1>
        <p class="subtitle">AI-Powered Interview Intelligence Platform</p>

        <div class="card">

            <h2>Technical Interview</h2>

            <p id="question">
                Tell us about yourself and your technical background.
            </p>

            <div class="timer">
                Time: <span id="timer">60</span>s
            </div>

            <button id="startBtn">Start Interview</button>
            <button id="nextBtn">Next Question</button>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
