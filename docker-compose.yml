services:

  backend:
    build:
      context: ./backend

    container_name: hireiq_backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - ./backend:/app


  postgres:
    image: postgres:16

    container_name: hireiq_postgres

    environment:
      POSTGRES_USER: hireiq
      POSTGRES_PASSWORD: hireiq_password
      POSTGRES_DB: hireiq

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U hireiq -d hireiq"
        ]

      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine

    container_name: hireiq_redis

    ports:
      - "6379:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 5s
      timeout: 3s
      retries: 10


  celery_worker:
    build:
      context: ./backend

    container_name: hireiq_celery_worker

    command:
      celery -A app.tasks.celery_app.celery_app worker --loglevel=info

    env_file:
      - ./backend/.env

    depends_on:
      redis:
        condition: service_healthy

      postgres:
        condition: service_healthy

    volumes:
      - ./backend:/app


volumes:

  postgres_data: